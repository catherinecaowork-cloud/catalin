<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>订单列表 · 环境 A</title>
  <style>
    body { font-family: sans-serif; margin: 24px; }
    table { border-collapse: collapse; width: 480px; }
    th, td { border: 1px solid #d9d9d9; padding: 8px 12px; text-align: left; }
    th { background: #fafafa; }
  </style>
</head>
<body>
  <h1>订单列表（环境 A）</h1>
  <p>环境 A 已有目标订单，lookup 应直接命中。</p>
  <table id="orders">
    <thead>
      <tr><th>单号</th><th>客户</th><th>状态</th></tr>
    </thead>
    <tbody>
      <tr class="order-row" data-order-id="A-100" data-customer="alice">
        <td class="order-code">A-100</td>
        <td>alice</td>
        <td>open</td>
      </tr>
      <tr class="order-row" data-order-id="A-101" data-customer="bob">
        <td class="order-code">A-101</td>
        <td>bob</td>
        <td>closed</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
