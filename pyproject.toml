[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autotest-platform"
version = "0.0.1"
description = "通用接口 / UI 自动化测试平台（P0 纵向切片）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "httpx>=0.27",
    "playwright==1.49.1",
    "cryptography>=42",
    "python-multipart>=0.0.9",
]

[project.scripts]
runner = "autotest_executor.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.15"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# 只开这两条：目的是防「未用导入 / 重复定义」这类债回流，不是借机做全仓风格整改。
# 开全量会把 scripts/ 里 10 条 E402（selftest 的 sys.path.insert 在前，属正当写法）一并变成红灯。
select = ["F401", "F811"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/control-plane", "packages/protocol", "packages/executor", "packages/adapters"]
markers = [
    "browser: 需要本机已安装 Playwright Chromium",
]

[tool.setuptools.packages.find]
where = ["packages/protocol", "packages/executor", "packages/adapters", "apps/control-plane"]

[tool.setuptools.package-data]
autotest_executor = ["browser/*.js"]
autotest_control = ["static/*.html"]
